  /* ============================================================
     THEME TOKENS — 一处改色，整站换肤（简约·墨色中性默认）

  :root {
    /* ---- 深空玻璃拟态 · 墨色打底，霓虹青+暖金勾勒，专业机器人看板 ---- */

    /* ---- 阴影（深色环境用更通透的黑影） ---- */

  .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }

    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); position: relative; }
  .quote::before { content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:2px; background: var(--accent); }

  /* ---------- overview rings ---------- */
  .rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 20px 6px; margin-top: 14px; }

  .rec { position: relative; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-tile);

    width:30px; height:30px; display:grid; place-items:center; cursor:pointer; }

/* ---------- 控制台仪表盘（NapCat 级专业看板） ---------- */
.dash-hero { position:relative; display:flex; gap:16px; align-items:center; padding:18px; border-radius:var(--radius-card);
  background:linear-gradient(135deg, color-mix(in oklab, var(--module-1) 14%, var(--surface-card)) 0%, var(--surface-card) 62%);
  border:1px solid var(--border); overflow:hidden; backdrop-filter:blur(20px) saturate(1.1); -webkit-backdrop-filter:blur(20px) saturate(1.1); }
.dash-hero::before { content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
  background:conic-gradient(from var(--glow-angle,0deg), transparent 0%, var(--module-1) 22%, transparent 44%, transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
  animation:dashspin 6s linear infinite; opacity:.55; pointer-events:none; }
@property --glow-angle { syntax:"<angle>"; initial-value:0deg; inherits:false; }
@keyframes dashspin { to { --glow-angle:360deg } }
.dash-hero.off::before { background:conic-gradient(from var(--glow-angle,0deg), transparent 0%, var(--danger) 22%, transparent 44%, transparent 100%); }
.dash-hero.scan::before { background:conic-gradient(from var(--glow-angle,0deg), transparent 0%, var(--module-3) 22%, transparent 44%, transparent 100%); }
.ring { --ring-pct:0; --ring-color:var(--module-1); position:relative; width:92px; height:92px; flex:0 0 auto; }
.ring svg { width:100%; height:100%; transform:rotate(-90deg); }
.ring .ring-bg { fill:none; stroke:var(--surface-nested); stroke-width:7; }
.ring .ring-val { fill:none; stroke:var(--ring-color); stroke-width:7; stroke-linecap:round; stroke-dasharray:0 999;
  transition:stroke-dasharray .8s cubic-bezier(.4,0,.2,1), stroke .4s; }
.ring .ring-core { position:absolute; inset:0; display:grid; place-items:center; }
.ring .ring-ico { position:absolute; inset:0; display:grid; place-items:center; color:var(--ring-color); }
.ring.breath .ring-core::before { content:""; position:absolute; width:52px; height:52px; border-radius:50%;
  background:color-mix(in oklab, var(--ring-color) 24%, transparent); animation:bbreath 2.4s ease-in-out infinite; }
@keyframes bbreath { 50% { transform:scale(1.35); opacity:.4 } }
.hero-meta { flex:1; min-width:0; }
.hero-meta .hm-state { font-size:13px; font-weight:700; letter-spacing:.02em; color:var(--text); }
.hero-meta .hm-name { font-size:20px; font-weight:700; color:var(--text); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hero-meta .hm-sub { font-size:11px; color:var(--text-tertiary); margin-top:3px; font-variant-numeric:tabular-nums; }
.hero-pill { display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:700; letter-spacing:.05em;
  padding:3px 8px; border-radius:999px; text-transform:uppercase; }
.hero-pill.on { background:color-mix(in oklab, var(--module-1) 20%, transparent); color:var(--module-1); }
.hero-pill.off { background:var(--danger-muted); color:var(--danger); }
.hero-pill.scan { background:color-mix(in oklab, var(--module-3) 20%, transparent); color:var(--module-3); }
.dash-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:12px; }
.dstat { position:relative; padding:14px 10px; border-radius:var(--radius-tile); background:var(--surface-card);
  border:1px solid var(--border); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); overflow:hidden; }
.dstat::after { content:""; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--ds-c,var(--module-2));
  opacity:.85; border-radius:0 0 var(--radius-tile) var(--radius-tile); }
.dstat .dv { font-size:20px; font-weight:750; font-variant-numeric:tabular-nums; color:var(--text); line-height:1.1; }
.dstat .dl { font-size:10px; color:var(--text-tertiary); margin-top:5px; letter-spacing:.02em; }
.dstat .du { font-size:9px; color:var(--text-tertiary); opacity:.75; margin-top:1px; }
.sec-title .sec-badge { font-size:10px; font-weight:700; letter-spacing:.08em; color:var(--accent);
  border:1px solid color-mix(in oklab, var(--accent) 40%, transparent); border-radius:999px; padding:2px 8px; background:color-mix(in oklab, var(--accent) 12%, transparent); }
.dash-chart { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); padding:14px 14px 10px; }
.dash-chart .dc-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.dash-chart .dc-t { font-size:13px; font-weight:650; color:var(--text); }
.dash-chart .dc-legend { display:flex; gap:10px; font-size:10px; color:var(--text-tertiary); }
.dash-chart .dc-legend i { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:baseline; }
.dash-pct { position:absolute; inset:0; display:grid; place-items:center; font-size:17px; font-weight:800; color:var(--race-c, var(--module-4)); font-variant-numeric:tabular-nums; }
.dash-log { background:oklch(14% 0.02 240); border:1px solid var(--border); border-radius:var(--radius-card); overflow:hidden; }
.dash-log .dl-h { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--border); }
.dash-log .dl-h .dl-t { font-size:13px; font-weight:650; color:var(--text); display:flex; align-items:center; gap:7px; }
.dash-log .dl-h .dl-live { width:7px; height:7px; border-radius:50%; background:var(--module-1); animation:bpulse 1.2s infinite; }
.dash-log .dl-body { max-height:220px; overflow-y:auto; padding:6px 14px; font-family:var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace); font-size:11.5px; }
.dlog { display:flex; gap:8px; padding:6px 0; border-bottom:1px solid color-mix(in oklab, var(--border) 60%, transparent); align-items:flex-start; }
.dlog:last-child { border-bottom:none; }
.dlog .dt { color:var(--text-tertiary); flex:0 0 auto; font-variant-numeric:tabular-nums; }
.dlog .dlv { color:var(--module-2); flex:0 0 auto; font-weight:700; }
.dlog .dlv.err { color:var(--danger); }
.dlog .dlv.warn { color:var(--module-3); }

.dlog .dlt { color:var(--text-secondary); word-break:break-all; line-height:1.5; }
.dash-log .dl-empty { padding:18px 14px; text-align:center; color:var(--text-tertiary); font-size:12px; }

/* ---------- 用量页 / 记忆页 ---------- */
.usage-hero { display:flex; gap:14px; align-items:center; padding:16px 18px; border-radius:var(--radius-card);
  background:linear-gradient(135deg, color-mix(in oklab, var(--module-4) 13%, var(--surface-card)) 0%, var(--surface-card) 60%);
  border:1px solid var(--border); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
.usage-ring { position:relative; width:76px; height:76px; flex:0 0 auto; }
.usage-ring svg { width:100%; height:100%; transform:rotate(-90deg); }
.usage-ring .ur-bg { fill:none; stroke:var(--surface-nested); stroke-width:6.5; }
.usage-ring .ur-val { fill:none; stroke:var(--module-4); stroke-width:6.5; stroke-linecap:round; stroke-dasharray:0 999; transition:stroke-dasharray .8s cubic-bezier(.4,0,.2,1); }
.usage-ring .ur-core { position:absolute; inset:0; display:grid; place-items:center; font-size:12px; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums; }
.usage-meta { flex:1; min-width:0; }
.usage-meta .um-total { font-size:22px; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.usage-meta .um-sub { font-size:11px; color:var(--text-tertiary); margin-top:3px; }
.usage-meta .um-pill { display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:700; letter-spacing:.05em;
  padding:3px 8px; border-radius:999px; background:color-mix(in oklab, var(--module-4) 18%, transparent); color:var(--module-4); margin-top:8px; }
.rank-list { display:flex; flex-direction:column; gap:2px; padding:6px 0; }
.rank-row { display:flex; align-items:center; gap:12px; padding:10px 8px; border-radius:var(--radius-tile); cursor:pointer; transition:background .15s; }
.rank-row:hover { background:var(--surface-nested); }
.rank-row .r-idx { width:24px; height:24px; border-radius:8px; display:grid; place-items:center; font-size:11px; font-weight:800;
  background:var(--surface-nested); border:1px solid var(--border); color:var(--text-secondary); flex:0 0 auto; }
.rank-row.top1 .r-idx { background:color-mix(in oklab, var(--module-3) 22%, transparent); color:var(--module-3); border-color:color-mix(in oklab, var(--module-3) 40%, transparent); }
.rank-row.top2 .r-idx { background:color-mix(in oklab, var(--module-2) 20%, transparent); color:var(--module-2); border-color:color-mix(in oklab, var(--module-2) 40%, transparent); }
.rank-row.top3 .r-idx { background:color-mix(in oklab, var(--accent) 20%, transparent); color:var(--accent); border-color:color-mix(in oklab, var(--accent) 40%, transparent); }
.rank-row .r-who { width:120px; flex:0 0 auto; font-size:13px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rank-row .r-bar { flex:1; height:7px; border-radius:999px; background:var(--surface-nested); overflow:hidden; }
.rank-row .r-fill { height:100%; border-radius:999px; background:linear-gradient(90deg, var(--module-4), var(--module-1)); transition:width .6s cubic-bezier(.4,0,.2,1); }
.rank-row .r-tok { font-size:12px; font-weight:700; color:var(--text-secondary); font-variant-numeric:tabular-nums; flex:0 0 auto; }
.mem-form-card { background:linear-gradient(135deg, color-mix(in oklab, var(--accent) 10%, var(--surface-card)) 0%, var(--surface-card) 55%);
  border:1px solid var(--border); border-radius:var(--radius-card); padding:16px; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
.mem-form-grid { display:grid; grid-template-columns:1fr 2fr; gap:12px; margin-top:12px; }
.mem-card { display:flex; gap:12px; align-items:flex-start; padding:13px 14px; border-bottom:1px solid var(--border); transition:background .15s; }
.mem-card:last-child { border-bottom:none; }
.mem-card:hover { background:var(--surface-nested); }
.mem-card .mc-ico { width:34px; height:34px; border-radius:var(--radius-tile); display:grid; place-items:center; flex:0 0 auto;
  background:color-mix(in oklab, var(--module-1) 16%, transparent); color:var(--module-1); }
.mem-card .mc-body { flex:1; min-width:0; }
.mem-card .mc-who { font-size:12px; font-weight:700; color:var(--accent); margin-bottom:4px; }
.mem-card .mc-txt { font-size:13.5px; color:var(--text); line-height:1.55; white-space:normal; }
.mem-card .mc-date { font-size:11px; color:var(--text-tertiary); margin-top:5px; font-variant-numeric:tabular-nums; }
.mem-card .mc-acts { display:flex; gap:6px; flex:0 0 auto; }

/* ---------- 系统监控 / 日志 / 好友 / 群聊 / 发消息 (NapCat 能力页) ---------- */
.sys-hero { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.sys-stat { position:relative; padding:14px; border-radius:var(--radius-card); background:var(--surface-card); border:1px solid var(--border); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); overflow:hidden; }
.sys-stat::after { content:""; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--ss-c,var(--module-2)); opacity:.85; }
.sys-stat .ss-lab { font-size:10px; color:var(--text-tertiary); letter-spacing:.03em; display:flex; align-items:center; gap:5px; }
.sys-stat .ss-val { font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--text); margin-top:7px; line-height:1; }
.sys-stat .ss-sub { font-size:10px; color:var(--text-tertiary); margin-top:5px; font-variant-numeric:tabular-nums; }
.sys-stat .ss-bar { height:4px; border-radius:3px; background:var(--surface-nested); margin-top:9px; overflow:hidden; }
.sys-stat .ss-bar-fill { height:100%; border-radius:3px; transition:width .5s cubic-bezier(.22,1,.36,1); }
.sys-proc { font-size:11px; color:var(--text-secondary); font-variant-numeric:tabular-nums; line-height:1.7; }
.kv-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; }
.kv-grid .kv { display:flex; justify-content:space-between; font-size:12px; padding:6px 0; border-bottom:1px dashed color-mix(in oklab, var(--border) 70%, transparent); }
.kv-grid .kv .k { color:var(--text-tertiary); }
.kv-grid .kv .v { color:var(--text); font-variant-numeric:tabular-nums; font-weight:600; }

.log-view { background:oklch(14% 0.02 240); border:1px solid var(--border); border-radius:var(--radius-card); overflow:hidden; }
.log-view .lv-h { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--border); }
.log-view .lv-t { font-size:13px; font-weight:650; color:var(--text); display:flex; align-items:center; gap:7px; }
.log-view .lv-live { width:7px; height:7px; border-radius:50%; background:var(--module-1); animation:bpulse 1.2s infinite; }
.log-view .lv-filters { display:flex; gap:5px; }
.log-view .lv-f { padding:4px 10px; font-size:10.5px; font-weight:650; border-radius:var(--radius-tile); border:1px solid var(--border); background:var(--surface-nested); color:var(--text-tertiary); cursor:pointer; transition:.15s; }
.log-view .lv-f.active { background:color-mix(in oklab, var(--accent) 16%, transparent); color:var(--accent); border-color:color-mix(in oklab, var(--accent) 40%, transparent); }
.log-view .lv-body { max-height:440px; overflow-y:auto; padding:8px 6px; font-family:var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace); font-size:11.5px; }
.lv-row { display:flex; gap:8px; padding:5px 10px; border-radius:8px; align-items:flex-start; }
.lv-row:hover { background:color-mix(in oklab, var(--border) 55%, transparent); }
.lv-row .lv-ts { color:var(--text-tertiary); flex:0 0 auto; font-variant-numeric:tabular-nums; }
.lv-row .lv-lv { flex:0 0 auto; width:38px; text-align:center; font-weight:800; font-size:10px; border-radius:5px; padding:1px 0; text-transform:uppercase; }
.lv-row .lv-lv.info { color:var(--module-1); background:color-mix(in oklab, var(--module-1) 16%, transparent); }
.lv-row .lv-lv.warn { color:var(--module-3); background:color-mix(in oklab, var(--module-3) 16%, transparent); }
.lv-row .lv-lv.error { color:var(--danger); background:var(--danger-muted); }
.lv-row .lv-lv.debug { color:var(--text-tertiary); background:var(--surface-nested); }
.lv-row .lv-msg { color:var(--text-secondary); word-break:break-all; line-height:1.5; flex:1; }
.lv-empty { padding:18px 14px; text-align:center; color:var(--text-tertiary); font-size:12px; }

.cnt-search { width:100%; box-sizing:border-box; padding:10px 12px; border-radius:var(--radius-tile); border:1px solid var(--border); background:var(--surface-card); color:var(--text); font-size:13px; }
.cnt-search:focus { outline:none; border-color:color-mix(in oklab, var(--accent) 60%, transparent); box-shadow:0 0 0 3px color-mix(in oklab, var(--accent) 16%, transparent); }
.cnt-meta { font-size:11px; color:var(--text-tertiary); margin:8px 2px 4px; font-variant-numeric:tabular-nums; }
.cnt-row mark { background:color-mix(in oklab, var(--accent) 30%, transparent); color:var(--accent); border-radius:3px; padding:0 2px; }
.cnt-list { max-height:520px; overflow-y:auto; margin-top:10px; border:1px solid var(--border); border-radius:var(--radius-card); background:var(--surface-card); }
.cnt-row { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .15s; }
.cnt-row:last-child { border-bottom:none; }
.cnt-row:hover { background:var(--surface-nested); }
.cnt-row .cnt-ava { width:38px; height:38px; border-radius:var(--radius-tile); display:grid; place-items:center; flex:0 0 auto; background:color-mix(in oklab, var(--module-1) 14%, transparent); color:var(--module-1); font-weight:800; font-size:14px; }
.cnt-row .cnt-body { flex:1; min-width:0; }
.cnt-row .cnt-name { font-size:13.5px; font-weight:650; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cnt-row .cnt-alias { font-size:11px; color:var(--text-tertiary); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cnt-row .cnt-id { font-size:10px; color:var(--text-tertiary); opacity:.7; font-family:var(--font-mono, ui-monospace, monospace); }
.cnt-row .cnt-act { flex:0 0 auto; font-size:11px; color:var(--accent); display:flex; align-items:center; gap:4px; }

.tag { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; letter-spacing:.04em; }
.tag.mem { background:color-mix(in oklab, var(--module-2) 18%, transparent); color:var(--module-2); }

.send-hero { display:grid; grid-template-columns:1fr; gap:12px; margin-top:16px; }
.send-form { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); padding:16px; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
.send-field { margin-bottom:14px; }
.send-field .lab { font-size:11px; color:var(--text-tertiary); margin-bottom:7px; font-weight:600; letter-spacing:.02em; }
.send-field input, .send-field textarea, .send-field select { width:100%; box-sizing:border-box; padding:10px 12px; border-radius:var(--radius-tile); border:1px solid var(--border); background:var(--surface-nested); color:var(--text); font-size:13px; }
.send-field textarea { resize:vertical; min-height:110px; font-family:inherit; }
.send-tabs { display:flex; gap:8px; margin-bottom:12px; }
.send-tab { flex:1; padding:9px 6px; text-align:center; border-radius:var(--radius-tile); border:1px solid var(--border); background:var(--surface-nested); color:var(--text-secondary); font-size:12px; font-weight:600; cursor:pointer; transition:.15s; }
.send-tab.active { background:color-mix(in oklab, var(--accent) 16%, transparent); color:var(--accent); border-color:color-mix(in oklab, var(--accent) 40%, transparent); }
.send-preview { font-size:12px; color:var(--text-secondary); background:var(--surface-nested); border-radius:var(--radius-tile); padding:10px 12px; margin-top:8px; line-height:1.6; word-break:break-all; }

</style>

<body>
<div class="blob-field" aria-hidden="true"><div class="blob bg1"></div><div class="blob bg2"></div><div class="blob bg3"></div></div>
<div class="app">
  <div class="topbar">
    <button class="menu-btn" id="btn-menu"></button>
    <div class="title" id="topTitle">我的工作台<small id="topSub">Personal Workbench</small></div>
    <span class="date-chip" id="dateChip"></span>
  </div>
  <div id="screen"></div>
</div>

<!-- bottom nav -->
<div class="nav" id="nav">
  <div class="n active" data-nav="bot"></div>
  <div class="n" data-nav="drawer"></div>
  <div class="n" data-nav="refresh"></div>
</div>

<!-- drawer -->
<div class="scrim" id="scrim"></div>

  <div class="dh">
    <button class="dclose" id="drawerClose"></button>
    <div class="brand" id="drawerBrand" title="点击更换头像"><img src="assets/avatar.jpg" alt="头像" id="brandImg"/><span class="brand-cam" id="brandCam"></span></div>
    <input type="file" id="avatarInput" accept="image/*" hidden/>
    <div><h2 id="drawerName">我的工作台</h2><p id="drawerSlogan">Personal Workbench</p></div>
  </div>
  <div class="dsep"></div>
  <div id="drawerList"></div>
  <div class="dsep"></div>

</aside>

<!-- keyboard shortcut hint -->
<button class="kbd-hint" id="kbdHint" title="快捷键 (?)" aria-label="查看快捷键">?</button>

<script>
/* ============================================================
   CONFIG — 唯一需要定制的地方。
   modules 里每个模块 = 一个功能页；type 决定它长什么样、记什么字段。
   支持的 type：
     todo     今日计划/待办（勾选 + 优先级）
     checkin  习惯打卡（连续天数，每天清零）
     progress 长期计划（进度条：当前/目标）
     finance  记账（收入/支出 + 分类 + 金额）
     note     内容记录/日记（标题 + 正文 + 心情标签）
   图标用 icon 字段（取自下方 ICONS 图标库，全部为单色线性图标）。
   ============================================================ */
const CONFIG = {
  storageKey: "meridian-workbench-v1",   // 换 key 可强制重置
  owner: "微信机器人",                  // 抽屉顶部标题

function isoToday(){ return new Date().toISOString().slice(0,10); }
function today(){ return isoToday(); }
function avgProgress(list){
  if(!list||!list.length) return { value: 0, sub: "0" };
  const v = Math.round(list.reduce((s,x)=>s+Math.min(100,(x.current/x.target)*100||0),0)/list.length);
  return { value: v, sub: `${list.length} 项` };
}

/* ---------- ring svg ---------- */
function ringSVG(pct, color){
  const r=25, c=2*Math.PI*r, off=c*(1-Math.min(100,pct)/100);
  return `<svg class="gauge" viewBox="0 0 60 60"><circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--border)" stroke-width="5.5"/>
    <circle cx="30" cy="30" r="${r}" fill="none" stroke="${color}" stroke-width="5.5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

function trendSVG(series){
  const w=320, h=120, padX=10, padTop=14, padBot=18;
  const max=Math.max(...series), min=Math.min(...series);
  const rng=(max-min)||1;
  const innerW=w-2*padX, innerH=h-padTop-padBot;
  const pts=series.map((v,i)=>{
    const x=padX+innerW*i/(series.length-1);
    const y=padTop+innerH*(1-(v-min)/rng);
    return [x,y];
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${padX+innerW} ${h-padBot} L ${padX} ${h-padBot} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#fff" stroke="var(--module-2)" stroke-width="2"/>`).join('');
  return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--module-2)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="var(--module-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

/* ---------- donut chart (支出占比) ---------- */
function donutSVG(segs){
  const total=segs.reduce((s,x)=>s+x.amount,0)||1;
  const r=42, c=2*Math.PI*r; let acc=0; const out=[];
  segs.forEach(s=>{
    const len=(s.amount/total)*c;
    out.push(`<circle cx="52" cy="52" r="${r}" fill="none" stroke="${s.color}" stroke-width="14"
      stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(c-acc).toFixed(2)}" transform="rotate(-90 52 52)"/>`);
    acc+=len;
  });
  return `<svg viewBox="0 0 104 104" width="104" height="104">${out.join("")}</svg>`;
}

/* ---------- calendar grid (打卡月视图) ---------- */
let calMonth=null, calItemId=null;
function renderCalendar(m, it){
  if(!it.length) return "";
  const now=new Date();
  const cm=calMonth||{y:now.getFullYear(),m:now.getMonth()};
  const item=it.find(x=>x.id===calItemId)||it[0]; calItemId=item.id;
  const y=cm.y, mo=cm.m;
  const startDow=new Date(y,mo,1).getDay();
  const days=new Date(y,mo+1,0).getDate();
  const todayIso=isoToday();
  const log=item.log||{};
  const chips=it.map(x=>`<button type="button" class="cal-chip ${x.id===item.id?'on':''}" data-calitem="${x.id}">${esc(x.title)}</button>`).join("");
  let cells="", monthCount=0;
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell blank"></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const on=!!log[ds]; if(on) monthCount++;
    cells+=`<button type="button" class="cal-cell ${on?'on':''} ${ds===todayIso?'today':''}" data-date="${ds}"${on?` style="background:${m.color};border-color:${m.color}"`:''}>${d}</button>`;
  }
  return `<div class="panel cal-panel">
    <div class="cal-hd"><button class="cal-nav" data-cal="prev" aria-label="上月">${icon("chevron",16,2)}</button>
      <span class="cal-title">${y}年${mo+1}月</span>
      <button class="cal-nav" data-cal="next" aria-label="下月">${icon("chevron",16,2)}</button></div>
    <div class="cal-chips">${chips}</div>
    <div class="cal-dow">${"日一二三四五六".split("").map(x=>`<span>${x}</span>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-foot">${icon("flame",13)} 连续 ${streak(log)} 天 · 本月 ${monthCount}/${days} 天</div></div>`;
}
function wireCalendar(key, it){
  const block=$("#screen").querySelector(".cal-panel"); if(!block) return;
  block.querySelectorAll("[data-cal]").forEach(el=>el.onclick=()=>{
    const now=new Date(); let y=calMonth?calMonth.y:now.getFullYear(), mo=calMonth?calMonth.m:now.getMonth();
    if(el.dataset.cal==="prev"){ mo--; if(mo<0){mo=11;y--;} }
    else { mo++; if(mo>11){mo=0;y++;} }
    calMonth={y,m:mo}; render();
  });
  block.querySelectorAll("[data-calitem]").forEach(el=>el.onclick=()=>{ calItemId=+el.dataset.calitem; render(); });
  block.querySelectorAll(".cal-cell[data-date]").forEach(el=>el.onclick=()=>{
    const item=it.find(x=>x.id===calItemId)||it[0]; if(!item) return;
    const ds=el.dataset.date; item.log=item.log||{};
    const wasOn=!!item.log[ds];
    const todayIso=isoToday();
    // 今天之前的日期取消打卡：高风险（会断连续），先确认
    if(wasOn && ds<todayIso){
      confirmCalUncheck(item, ds);
      return;
    }
    if(wasOn) delete item.log[ds]; else item.log[ds]=true;
    persist();
    if(wasOn) showCalUndo(item, ds);
  });
}
let calToastTimer=null;
function showCalUndo(item, ds){
  let t=$("#calToast");
  if(!t){ t=document.createElement("div"); t.id="calToast"; t.className="cal-toast"; document.body.appendChild(t); }
  t.innerHTML=`已取消 ${ds.slice(5)} 打卡<button type="button" id="calUndo">撤销</button>`;
  t.classList.add("show");
  const undo=$("#calUndo"); if(undo) undo.onclick=()=>{ item.log=item.log||{}; item.log[ds]=true; persist(); hideCalToast(); };
  clearTimeout(calToastTimer);
  calToastTimer=setTimeout(hideCalToast, 4000);
}

function wireRetry(el, retry){ if(!el) return; el.querySelectorAll("[data-retry]").forEach(b=>b.onclick=()=> (retry||render)()); }
// 快捷：展示错误 + 绑定重试（兼容旧用法），附带全局错误提示
function showError(el, err, retryF){
  const msg = err?.message || err || '加载失败';
  botFail(el, msg);
  wireRetry(el, retryF);
  if(!window._lastErrMsg || window._lastErrMsg !== msg){
    window._lastErrMsg = msg;
    toast.error(msg);
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

/* ---------- Toast 通知系统 ---------- */
function toast(msg, type='info'){
  if(!msg) return;
  let container = document.querySelector('.toast-container');
  if(!container){
    container = document.createElement('div');
    container.className = 'toast-container';
    document.body.appendChild(container);
  }
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const iconMap = { success:'check', error:'alert', info:'msg', warning:'alert' };
  el.innerHTML = `${icon(iconMap[type]||'msg',15)}<span>${esc(msg)}</span>`;
  container.appendChild(el);
  const remove = ()=>{ el.remove(); if(!container.children.length) container.remove(); };
  el.querySelector('.toast');
  setTimeout(remove, 3200);
}
toast.success = (msg)=>toast(msg, 'success');
toast.error = (msg)=>toast(msg, 'error');
toast.info = (msg)=>toast(msg, 'info');
toast.warning = (msg)=>toast(msg, 'warning');

    document.body.appendChild(statusEl);
  }
  const showOffline = ()=>{
    statusEl.className = 'net-status offline show';
    statusEl.textContent = '网络连接已断开，请检查网络';
  };
  const showOnline = ()=>{
    statusEl.className = 'net-status online show';

}

/* ---------- API Client 抽象层：端点集中定义，前端不再感知路径拼接 ---------- */
const BOT_BASE = (CONFIG.modules.find(x=>x.key==="bot")||{}).api||"/api";
function apiUrl(path, params){ const u=new URL(BOT_BASE+path, location.origin); Object.entries(params||{}).forEach(([k,v])=>{ if(v!=null) u.searchParams.set(k,v); }); return u; }
async function apiGet(path, params){
  const r=await fetch(apiUrl(path, params));
  if(!r.ok){
    let msg = `请求失败 (${r.status})`;
    try{ const err = await r.json(); if(err.message) msg = err.message; else if(err.error) msg = err.error; }catch(e){}
    throw new Error(msg);
  }
  return r.json();
}
async function apiSend(path, params, opts={}){
  const r=await fetch(apiUrl(path, params), opts);
  if(!r.ok){
    let msg = `请求失败 (${r.status})`;
    try{ const err = await r.json(); if(err.message) msg = err.message; else if(err.error) msg = err.error; }catch(e){}
    throw new Error(msg);
  }
  return r.json();
}

    }catch(e){ if(!failed){ failed=true; toast.error("状态同步失败："+(e.message||"网络异常")); } }
  };

  const refreshStats = async ()=>{
    try{
      const [sum, day, msgs, rec] = await Promise.all([
        api.usageSummary(), api.usageDaily(7), api.messages(50), api.recalls(20)
      ]);
      const calls = sum.totalCalls??0, tin = sum.totalIn??0, tout = sum.totalOut??0;
      $("#st-calls").textContent  = fmtC(calls);
      $("#st-tokens").textContent = fmtT(tin+tout);
      $("#st-msgs").textContent   = fmtC(msgs.length);

      const hit = rec.filter(r=>(r.hitCount??0)>0).length;
      const rate = rec.length ? hit/rec.length : null;
      $("#st-recall").textContent = (rate==null) ? "—" : fmtPct(rate);

      const chart = $("#bot-trend");
      const trend = (day && day.data) || [];
      if(trend.length){ chart.innerHTML = botTrendSVG(trend); wireTrendHover(chart, trend); }
      else chart.innerHTML = `<div class="dl-empty">暂无用量数据</div>`;

      renderLog([...msgs.map(mm=>({t:mm.created_at||mm.createdAt, kind:"in", msg:`${mm.type||"msg"} · ${mm.contact_id||mm.contactId||""}`} )),
                 ...rec.map(rr=>({t:rr.createdAt||rr.created_at, kind:"recall", msg:`命中 ${rr.hitCount} 条 · ${rr.query||""}`}))]);
    }catch(e){ if(!failed){ failed=true; toast.error("数据加载失败："+(e.message||"未知错误")); } }
  };

  const renderLog = (events)=>{
    const body = $("#bot-log");
    if(!body) return;
    if(!events.length){ body.innerHTML = `<div class="dl-empty">暂无事件，机器人收到消息后会实时刷新</div>`; $("#dl-count").textContent="0 条"; return; }
    const LABEL = { in:"IN", recall:"RECALL" };
    const sorted = events.filter(e=>e && e.t).sort((a,b)=>new Date(b.t)-new Date(a.t)).slice(0,12);
    body.innerHTML = sorted.map(e=>`<div class="dlog"><span class="dt">${fmtDateTime(e.t)}</span>
      <span class="dlv ${e.kind==='in'?'in':''}">${LABEL[e.kind]||e.kind.toUpperCase()}</span>
      <span class="dlt">${esc(e.msg||"")}</span></div>`).join("");
    $("#dl-count").textContent = sorted.length + " 条";
  };

  refreshStatus();
  refreshStats();

  $("#bot-refresh").onclick = ()=>{ stopPoll(); failed=false; refreshStatus(); refreshStats(); };
  $("#screen").querySelectorAll(".cap-link").forEach(card=>{ card.onclick = ()=>go('bot-'+card.dataset.page); });

  const ctl = (label, fn)=>{
    const btn = document.getElementById("ctl-"+label);
    if(!btn) return;
    btn.onclick = async ()=>{
      btn.disabled = true;
      const orig = btn.innerHTML;
      btn.innerHTML = icon("refresh",15,2);
      try{ await fn(); toast.success("指令已下发"); await refreshStatus(); }
      catch(e){ toast.error(e.message || "操作失败"); }
      finally{ btn.disabled = false; btn.innerHTML = orig; }
    };
  };
  ctl("logout", api.botLogout);
  ctl("stop",   api.botStop);
  ctl("start",  api.botStart);

  const tracker = setInterval(()=>{ if(!$("#bot-stats")){ clearInterval(tracker); return; } refreshStats(); }, 8000);
}

  $("#bot-back").onclick = ()=>go('bot');

function fmtMsgContent(mm){
  const meta = mm?.meta||{};
  const type = (mm?.type||'').trim();
  const fileName = (meta?.url||meta?.file||meta?.path||'').split('/').pop()||'';
  if(!type) return esc(meta?.text||mm?.content||'');
  if(type==='文本') return esc(meta?.text||mm?.content||'');
  if(type==='图片') return `<i class="muted">${icon("img",14)} 图片 ${fileName||'图片'}</i>`;
  if(type==='视频') return `<i class="muted">${icon("video",14)} 视频 ${fileName||'视频'}</i>`;
  if(type==='语音') return `<i class="muted">${icon("mic",14)} 语音 ${(meta?.duration||'') }s ${fileName||'语音文件'}</i>`;
  if(type==='链接') return `<a class="link" href="${esc(meta?.url||'')}" target="_blank">${icon("link",12)} ${esc(meta?.title||meta?.url||'')}</a>`;
  if(type==='小程序') return `<i class="muted">${icon("app",14)} ${esc(meta?.title||'小程序')}</i>`;
  if(type==='文件') return `<i class="muted">${icon("file",14)} ${fileName||'文件'}</i>`;
  if(type==='表情') return `<i class="muted">${icon("emoji",14)} 表情</i>`;
  return esc(meta?.text||meta?.title||mm?.content||'');
}

function fmtDateTime(ts){
  return new Date(ts).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
}

        try{ await api.deleteMemory(b.dataset.id); toast.success("已删除记忆"); load(); }catch(err){ toast.error("删除失败："+(err?.message||err)); }
        finally{ b.disabled=false; b.style.opacity="1"; b.innerHTML = icon("trash",14); };
      }; });
      el.querySelectorAll(".js-mem-edit").forEach(btn=>{ btn.onclick=(e)=>{ e.stopPropagation(); editingId = Number(btn.dataset.id); load(); }; });
      el.querySelectorAll(".js-mem-save").forEach(btn=>{ btn.onclick=async(e)=>{ e.stopPropagation(); const row = btn.closest(".mem-card"); if(!row) return; const box=row.querySelector(".mem-edit-box"); const newContent=box.value.trim(); if(!newContent){ toast.warning("内容不能为空"); return; } btn.disabled=true; btn.innerHTML = icon("refresh",14);
        try{ await api.updateMemory(Number(btn.dataset.id), newContent); toast.success("已更新记忆"); load(); }catch(err){ toast.error("更新失败："+(err?.message||err)); }
        finally{ btn.disabled=false; btn.innerHTML = icon("check",14); };
      }; });
      el.querySelectorAll(".js-mem-cancel").forEach(btn=>{ btn.onclick=(e)=>{ e.stopPropagation(); cancelEdit(); }; });
    }catch(e){ showError(el, e, retry); }
  };
  load();

  // 搜索框防抖过滤
  let searchTimer = null;
  $("#mem-search").addEventListener('input', ()=>{
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=>{
      searchKey = $("#mem-search").value.trim();
      cancelEdit();
      load();
    }, 300);
  });

  const msg=(txt,ok)=>{ const m=$("#mem-msg"); m.style.display="block"; m.innerHTML=botSuffix(txt,ok?'ok':'off'); };
  let saving = false, debounceTimer = null;
  const doSave = async()=>{
    if(saving) return;
    const contactId=$("#mem-contact").value.trim();
    const content=$("#mem-content").value.trim();
    if(!contactId||!content){ msg("请填写用户标识和内容",false); return; }
    saving = true;
    const btn = $("#mem-save");
    btn.classList.add('btn-loading');
    btn.disabled = true;
    try{ 
      await api.addMemory({ contactId, content }); 
      $("#mem-contact").value=""; 
      $("#mem-content").value=""; 
      msg("已保存",true);
      load();
    }catch(e){ 
      const errTip = (e && e.message) || e || '保存失败';
      msg(errTip,false);
      toast.error(errTip);
    }
    finally{ 
      saving = false; 
      btn.classList.remove('btn-loading');
      btn.disabled = false;
    }
  };
  $("#mem-save").onclick=doSave;
  $("#mem-contact").addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); doSave(); } });
  $("#mem-content").addEventListener('keydown',(e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSave(); } });
  document.addEventListener('keydown',(e)=>{ if(e.ctrlKey && e.key==='s'){ e.preventDefault(); doSave(); } });
  document.addEventListener('keydown',(e)=>{ if(e.ctrlKey && e.key==='d'){ e.preventDefault(); closeDrawer(); openDrawer(); } });
  // 输入变化时防抖启用保存按钮
  ["#mem-contact","#mem-content"].forEach(sel=>{
    $(sel).addEventListener('input',()=>{
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(()=>{
        const hasContent = !!$("#mem-contact").value.trim() && !!$("#mem-content").value.trim();
        $("#mem-save").disabled = !hasContent;
        $("#mem-save").style.opacity = hasContent ? '1' : '.5';
      }, 300);
    });
  });
  // 初始状态
  $("#mem-save").disabled = !$("#mem-contact").value.trim() || !$("#mem-content").value.trim();
  $("#bot-back").onclick = ()=>go('bot');
}

/* ---------- NapCat 能力页：系统监控 / 日志 / 好友 / 群聊 / 发消息 ---------- */

const fmtBytes = n => { if(n==null) return "—"; const kb=n/1024, mb=kb/1024, gb=mb/1024; if(gb>=1) return gb.toFixed(2)+" GB"; if(mb>=1) return mb.toFixed(1)+" MB"; if(kb>=1) return kb.toFixed(1)+" KB"; return n+" B"; };
const fmtSec = s => { if(s==null) return "—"; const d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60), sec=Math.floor(s%60); if(d) return `${d}天${h}时`; if(h) return `${h}时${m}分`; if(m) return `${m}分${sec}秒`; return `${sec}秒`; };
const fmtNet = n => { if(n==null) return "—"; if(n<1024) return n.toFixed(0)+" B/s"; if(n<1048576) return (n/1024).toFixed(1)+" KB/s"; return (n/1048576).toFixed(2)+" MB/s"; };

function renderBotSys(m){
  $("#screen").innerHTML = botPageHead("系统监控","CPU · 内存 · 网络 · 负载 实时采样")

    <div class="ss-lab">${icon(ico,13,1.8)} ${lab}</div>
    <div class="ss-val">—</div><div class="ss-sub">…</div></div>`;

  const render = (d)=>{
    const hero = $("#sys-hero");
    if(!hero) return;
    const cpu = d.cpuPercent;
    const cpuV = cpu==null ? "—" : cpu.toFixed(1)+"%";
    const cpuPct = cpu==null ? 0 : Math.min(100, Math.max(0, cpu));
    const mem = d.mem || {};
    const memPct = mem.percent==null ? 0 : Math.min(100, Math.max(0, mem.percent));
    const bar = (pct, color) => `<div class="ss-bar"><div class="ss-bar-fill" style="width:${pct.toFixed(1)}%;background:${color}"></div></div>`;
    hero.innerHTML =
      `<div class="sys-stat" style="--ss-c:var(--module-4)"><div class="ss-lab">${icon("activity",13,1.8)} CPU</div><div class="ss-val">${cpuV}</div><div class="ss-sub">${d.load?('负载 ' + d.load.map(x=>x.toFixed(2)).join(' / ')):'—'}</div>${bar(cpuPct, "var(--module-4)")}</div>` +
      `<div class="sys-stat" style="--ss-c:var(--module-1)"><div class="ss-lab">${icon("chart",13,1.8)} 内存</div><div class="ss-val">${mem.percent??'—'}%</div><div class="ss-sub">${fmtBytes(mem.used)} / ${fmtBytes(mem.total)}</div>${bar(memPct, "var(--module-1)")}</div>` +
      `<div class="sys-stat" style="--ss-c:var(--module-2)"><div class="ss-lab">${icon("link",13,1.8)} 网络</div><div class="ss-val">${fmtNet(d.net?.rxPerSec)}</div><div class="ss-sub">↓ 下行 · 上行 ${fmtNet(d.net?.txPerSec)}</div></div>` +
      `<div class="sys-stat" style="--ss-c:var(--module-3)"><div class="ss-lab">${icon("clock",13,1.8)} 运行时长</div><div class="ss-val">${fmtSec(d.uptime)}</div><div class="ss-sub">进程 ${fmtSec(d.procUptime)}</div></div>`;

    $("#sys-env").innerHTML = `<div class="kv-grid">
      <div class="kv"><span class="k">主机名</span><span class="v">${esc(d.hostname||'—')}</span></div>
      <div class="kv"><span class="k">系统</span><span class="v">${esc(d.platform||'—')} / ${esc(d.arch||'—')}</span></div>
      <div class="kv"><span class="k">Node 版本</span><span class="v">${esc(d.nodeVersion||'—')}</span></div>
      <div class="kv"><span class="k">进程 PID</span><span class="v">${d.pid??'—'}</span></div>
      <div class="kv"><span class="k">RSS 常驻内存</span><span class="v">${fmtBytes(d.rss)}</span></div>
      <div class="kv"><span class="k">堆内存已用</span><span class="v">${fmtBytes(d.heapUsed)}</span></div>
    </div>`;
  };

  const refresh = async ()=>{
    try{ render(await api.systemStats()); }
    catch(e){ showError($("#sys-hero"), e, refresh); }
  };
  refresh();
  pollTimer = setInterval(refresh, 2000);
}

  $("#lv-filters").querySelectorAll(".lv-f").forEach(btn=>{
    btn.onclick = ()=>{
      curLv = btn.dataset.lv;
      $("#lv-filters").querySelectorAll(".lv-f").forEach(b=>b.classList.toggle("active", b===btn));
      paint();
    };
  });

  const body = $("#lv-body");
  body.onscroll = ()=>{ nearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 40; };

    if(!asc.length){
      body.innerHTML = `<div class="lv-empty">${all.length ? '当前级别暂无日志' : '暂无日志，服务启动后会持续记录'}</div>`;
      $("#lv-count").textContent = asc.length + " 条";

    }catch(e){ showError(body, e, refresh); }
  };
  refresh();
  pollTimer = setInterval(refresh, 3000);
}

    + `<div style="margin-top:16px">
      <div class="send-form">
        <div class="send-tabs" id="send-tabs">
          <div class="send-tab active" data-type="contact">${icon("user",14,1.8)} 私聊好友</div>
          <div class="send-tab" data-type="room">${icon("msg",14,1.8)} 群发消息</div>
        </div>
        <div class="send-field"><div class="lab">选择目标</div>
          <div id="send-picker">${botSuffix("加载目标…",'off')}</div></div>
        <div class="send-field"><div class="lab">消息内容</div>
          <textarea id="send-text" placeholder="输入要发送的消息…（Ctrl + Enter 发送）"></textarea>
          <div class="send-count" id="send-count">0 字</div></div>
        <div class="send-preview" id="send-preview" style="display:none"></div>
        <div style="margin-top:14px;display:flex;gap:10px;justify-content:flex-end">
          <button class="btn ghost" id="send-clear">清空</button>
          <button class="btn" id="send-go" disabled>${icon("bolt",15,2)} 发送</button>
        </div>
      </div>
    </div>`;

  $("#bot-back").onclick = ()=>go('bot');
  $("#bot-refer").onclick = ()=>renderBotSend(m);

  let curType = 'contact';
  let selected = { id:"", name:"" };

  const preset = (()=>{
    try{ return JSON.parse(sessionStorage.getItem("send-target")||"null"); }catch{ return null; }
  })();
  if(preset && preset.id){ curType = preset.type === 'room' ? 'room' : 'contact'; selected = { id:preset.id, name:preset.name||"" }; }

  const $tabs = $("#send-tabs");
  const $picker = $("#send-picker");
  const $text = $("#send-text");
  const $preview = $("#send-preview");
  const $go = $("#send-go");

  const setTab = (type)=>{
    curType = type;
    $tabs.querySelectorAll(".send-tab").forEach(t=>t.classList.toggle("active", t.dataset.type===type));
    // 仅当预设目标不属于新 tab 时才清空，避免「好友 → 群发」预填被误清
    if(preset && preset.id && preset.type !== type) selected = { id:"", name:"" };
    loadPicker();
  };
  $tabs.querySelectorAll(".send-tab").forEach(t=>{ t.onclick = ()=>setTab(t.dataset.type); });

  let cache = { contact:[], room:[] };
  const loadPicker = async ()=>{
    try{
      const key = curType === 'contact' ? 'contact' : 'room';
      if(!cache[key].length){
        if(key === 'contact') cache.contact = await api.contacts();
        else cache.room = await api.rooms();
      }
      const list = cache[key];
      const prior = selected.id;
      if(!list.length){ $picker.innerHTML = `<div class="empty" style="padding:20px"><div>暂无${key==='contact'?'联系人':'群聊'}</div></div>`; return; }
      $picker.innerHTML = `<select id="send-select">` + list.map(x=>{
        const label = key==='contact' ? (x.alias ? x.name+' · '+x.alias : x.name) : (x.topic||'未命名群聊');
        return `<option value="${attr(x.id)}" ${x.id===prior?'selected':''}>${esc(label)}</option>`;
      }).join("") + `</select>`;
      const sel = $("#send-select");
      const sync = ()=>{ const o = sel.options[sel.selectedIndex]; selected = o ? { id:o.value, name:o.textContent } : { id:"", name:"" }; renderPreview(); };
      sel.onchange = sync;
      sync();
    }catch(e){ showError($picker, e, loadPicker); }
  };

  const renderPreview = ()=>{
    const txt = $text.value;
    $("#send-count").textContent = txt.length + " 字";
    if(selected.id && txt.trim()){ $preview.style.display=""; $preview.innerHTML = `将发送给 <b>${esc(selected.name||selected.id)}</b>（${curType==='contact'?'私聊':'群聊'}）：<br/>${esc(txt)}`; }
    else $preview.style.display = "none";
    $go.disabled = sending || !(selected.id && txt.trim());
  };
  $text.oninput = renderPreview;
  $("#send-clear").onclick = ()=>{ $text.value=""; renderPreview(); };

  let sending = false;
  const doSend = async ()=>{
    if(sending) return;
    const text = $text.value.trim();
    if(!selected.id || !text) return;
    sending = true;
    $go.disabled = true;
    $go.innerHTML = `<span class="spinner"></span> 发送中`;
    try{
      const payload = curType==='contact' ? { contactId:selected.id, text } : { roomId:selected.id, text };
      const res = await api.sendMessage(payload);
      if(res && res.ok){ toast.success("发送成功"); $text.value=""; }
      else toast.error((res && res.error) || "发送失败");
    }catch(e){ toast.error(e.message || "发送失败"); }
    finally{ sending = false; $go.innerHTML = `${icon("bolt",15,2)} 发送`; renderPreview(); }
  };
  $go.onclick = doSend;
  $text.addEventListener("keydown", e=>{ if((e.ctrlKey||e.metaKey) && e.key==="Enter"){ e.preventDefault(); doSend(); } });

  loadPicker();
}

function botTrendSVG(data){
  const w=320, h=110, px=10, pt=12, pb=18, iw=w-2*px, ih=h-pt-pb;
  const norm = data.map(x=>({ date:x.date, inTokens:(x.inTokens??x.in_tokens)||0, outTokens:(x.outTokens??x.out_tokens)||0 }));
  const pts = norm.map(x=> x.inTokens + x.outTokens);
  const max = Math.max(...pts, 1);
  const co=(i,v)=>[px+iw*(i/(data.length-1||1)), pt+ih*(1-v/max)];
  const line = pts.map((v,i)=>{ const [x,y]=co(i,v); return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); }).join(' ');
  const area = line + ` L ${w-px} ${h-pb} L ${px} ${h-pb} Z`;
  const labels = norm.map((x,i)=>{ const [X]=co(i,0); return `<text x="${X.toFixed(1)}" y="${h-4}" text-anchor="middle" class="blab">${x.date.slice(5)}</text>`; }).join('');
  const circles = norm.map((x,i)=>{
    const [X,Y]=co(i,pts[i]);
    const tot = pts[i];
    return `<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="5" fill="none" stroke="var(--accent)" stroke-width="2"
      data-date="${x.date}" data-tokens="${tot}" data-in="${x.inTokens}" data-out="${x.outTokens}"/>`;
  }).join('');
  return `<svg class="bot-trend" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="btg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-3)" stop-opacity=".22"/><stop offset="1" stop-color="var(--module-3)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#btg)"/><path d="${line}" fill="none" stroke="var(--module-3)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    ${circles}${labels}</svg>`;
}

function wireTrendHover(container, data){
  const svg = container.querySelector(".bot-trend");
  if(!svg) return;
  const tip = document.createElement("div");
  tip.style.position = "absolute";
  tip.style.background = "var(--surface-card)";
  tip.style.border = "1px solid var(--border)";
  tip.style.borderRadius = "8px";
  tip.style.padding = "8px 10px";
  tip.style.fontSize = "12px";
  tip.style.color = "var(--text)";
  tip.style.boxShadow = "0 4px 12px oklab(0 0 0/.15)";
  tip.style.zIndex = "100";
  tip.style.pointerEvents = "none";
  tip.style.opacity = "0";
  tip.style.transition = "opacity .15s";
  container.appendChild(tip);

  svg.addEventListener("mousemove", (e)=>{
    const rect = svg.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const w = rect.width;
    const dataLen = data.length;
    const idx = Math.round((x / w) * (dataLen - 1));
    if(idx < 0 || idx >= dataLen) { tip.style.opacity = "0"; return; }

    const circle = svg.querySelectorAll("circle")[idx];
    if(!circle) { tip.style.opacity = "0"; return; }

    const date = circle.dataset.date || "";
    const tot = Number(circle.dataset.tokens).toLocaleString();
    const ink = Number(circle.dataset.in).toLocaleString();
    const out = Number(circle.dataset.out).toLocaleString();

    const month = date.slice(5,7);
    const day = date.slice(8,10);
    const formatted = `${month}月${day}日`;

    tip.innerHTML = `<div style="font-weight:600;margin-bottom:4px">${formatted}</div>
      <div>输入 Token：${ink}</div>
      <div>输出 Token：${out}</div>
      <div style="margin-top:2px">总计：${tot}</div>`;
    tip.style.left = (e.clientX + 12) + "px";
    tip.style.top = (e.clientY - 10) + "px";
    tip.style.opacity = "1";
  });

  svg.addEventListener("mouseleave", ()=>{ tip.style.opacity = "0"; });
}

function openConv(contactId, roomId){
  const mask=document.createElement("div"); mask.className="sheet-mask";
  const sheet=document.createElement("div"); sheet.className="sheet";
  sheet.innerHTML=`<div class="sh-h"><b>${esc(contactId||'匿名')}${roomId?' · 群聊':''}</b><button class="btn-close">${icon("close",16)}</button></div>
    <div class="sh-b"><div class="lineq"><span class="spinner"></span><span>加载中…</span></div></div>`;
  mask.appendChild(sheet); document.body.appendChild(mask);
  sheet.querySelector(".btn-close").onclick=()=>mask.remove();
  mask.onclick=(e)=>{ if(e.target===mask) mask.remove(); };
  const box=sheet.querySelector(".sh-b");

  const retry = async()=>{ try{ await load(); }catch(e){ showError(box, e, retry); } };
  const load = async()=>{
    try{
      const list = await api.conversations(contactId, roomId || null);
      const arr = list.slice().reverse();
      box.innerHTML = arr.length ? arr.map(mm=>{
        const meta = mm.meta||{};
        return `<div class="bmsg ${mm.role}"><div class="nm">${ROLE_LABEL[mm.role]||mm.role} · ${new Date(mm.created_at).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}</div><div class="bd">${escFmtMsg(mm)}</div></div>`;
      }).join("")
        : `<div class="empty"><span class="e">${icon("msg",24)}</span><div>暂无历史会话</div></div>`;
    }catch(e){ showError(box, e, retry); }
  };

  // 辅助：格式化消息内容（文本直接字，其他带图标）
  const escFmtMsg = (mm)=>{
    const meta = mm?.meta||{};
    const t = (mm?.type||'').trim();
    const fileName = (meta?.url||meta?.file||meta?.path||'').split('/').pop()||'';
    if(!t) return esc(meta?.text||mm?.content||'');
    if(t==='图片') return `<i class="muted">${icon("img",14)} 图片 ${fileName||'图片'}</i>`;
    if(t==='视频') return `<i class="muted">${icon("video",14)} 视频 ${fileName||'视频'}</i>`;
    if(t==='语音') return `<i class="muted">${icon("mic",14)} 语音 ${(meta?.duration||'') }s ${fileName||'语音文件'}</i>`;
    if(t==='链接') return `<a class="link" href="${esc(meta?.url||'')}" target="_blank">${icon("link",12)} ${esc(meta?.title||meta?.url||'')}</a>`;
    if(t==='小程序') return `<i class="muted">${icon("app",14)} ${esc(meta?.title||'小程序')}</i>`;
    if(t==='文件') return `<i class="muted">${icon("file",14)} ${fileName||'文件'}</i>`;
    if(t==='表情') return `<i class="muted">${icon("emoji",14)} 表情</i>`;
    return esc(meta?.text||mm?.content||'');
  };

  load();
}

/* ---------- MODULE VIEW ---------- */
function renderModule(key){
  const m=modOf(key); const it=data[key]||[];
  if(m.type==="bot"){ renderBot(m); return; }
  const t=today();
  let head="", extra="";
  if(m.type==="finance"){
    const inc=it.filter(x=>x.type==="income").reduce((s,x)=>s+ +x.amount,0);
    const exp=it.filter(x=>x.type==="expense").reduce((s,x)=>s+ +x.amount,0);
    head=`<div class="mod-summary">
      <div class="mini"><div class="l">收入</div><div class="v" style="color:var(--module-1)">¥${inc}</div></div>
      <div class="mini"><div class="l">支出</div><div class="v" style="color:var(--danger)">¥${exp}</div></div>
      <div class="mini"><div class="l">结余</div><div class="v">¥${inc-exp}</div></div></div>`;
  } else if(m.type==="todo"){
    const done=it.filter(x=>x.done).length; const pct=it.length?Math.round(done/it.length*100):0;
    head=headHero(m, `${done}/${it.length}`, "今日已完成", pct);
  } else if(m.type==="checkin"){
    const done=it.filter(x=>x.log&&x.log[t]).length; const pct=it.length?Math.round(done/it.length*100):0;
    head=headHero(m, `${done}/${it.length}`, "今日已打卡", pct);
  } else if(m.type==="progress"){
    const p=avgProgress(it);
    head=headHero(m, `${p.value}%`, `平均进度 · ${it.length} 项`, p.value);
  } else if(m.type==="note"){
    const todayN=it.filter(x=>x.date===t).length;
    head=headHero(m, `${it.length}`, `条记录 · 今日 ${todayN} 条`, null);
  }
  if(m.type==="checkin") extra=renderCalendar(m,it);
  const body = it.length ? it.map(x=>recHTML(m,x)).join("")
    : `<div class="empty"><span class="e">${icon(m.icon,26)}</span><div>还没有记录，点上方「新建」添加第一条吧</div></div>`;
  $("#screen").innerHTML = `<div class="greet"><div><h1>${m.name}</h1><p>${m.desc}</p></div>
      <button class="add" id="btn-add">${icon("plus",16,2.2)}新建</button></div>
    <div style="margin-top:16px">${head}${extra}
      <div class="sec-title">记录</div>${body}</div>`;
  wireModule(key);
}

/* per-module hero header: compact strip — icon + big number + label + optional progress bar */
function headHero(m, big, label, pct){
  const inner=`<div class="hero-ic" style="background:${m.tint};color:${m.color}">${icon(m.icon,20)}</div>
    <div style="flex:1;min-width:0"><div class="hero-tx"><span class="hero-v">${big}</span><span class="hero-l">${label}</span></div>
    ${pct!=null?`<div class="hero-bar"><i style="width:${Math.min(100,pct)}%;background:${m.color}"></i></div>`:''}</div>`;
  if(m.cover) return `<div class="hero has-cover"><div class="hero-bg" style="background-image:url('${attr(m.cover)}')"></div><div class="hero-inner">${inner}</div></div>`;
  return `<div class="hero">${inner}</div>`;
}

function recHTML(m,x){
  const pin=`<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="置顶">${icon("star",15)}</button>`;
  const del=`<button class="del js-del" data-id="${x.id}" title="删除">${icon("trash",16)}</button>`;
  const acts=`<div class="acts">${pin}${del}</div>`;
  const chkMark=icon("check",14,2.4);
  const thumb=x.image?`<img class="thumb" src="${attr(x.image)}" alt="">`:'';
  const customMeta=(m.fields||[]).filter(f=>x[f.key]).map(f=>`<span class="meta-tag">${esc(x[f.key])}</span>`).join("");
  const customBlock=customMeta?`<div class="meta-line">${customMeta}</div>`:'';
  const layout=x.layout||'default';
  const layoutCls=`rec-layout-${layout}`;

  // feature layout: 大图在上 + 标题 + 正文 (适合有图记录)
  if(layout==='feature' && x.image){
    const body=(x.content||x.note||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column">
      ${thumb}
      <div class="feat-title">${esc(x.title||'无标题')}</div>
      ${body?`<div class="feat-body">${esc(body)}</div>`:''}
      ${customBlock?`<div style="padding:0 12px 12px">${customBlock}</div>`:''}</div></div>`;
  }
  // quote layout: 大字居中 (适合短文本/灵感/金句)
  if(layout==='quote'){
    const text=(x.content||x.title||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column;align-items:center;text-align:center">
      <div class="quote-text">${esc(text)}</div>
      ${x.mood?`<div class="quote-meta">${esc(x.mood)}${x.date?` · ${esc(x.date)}`:''}</div>`:(x.date?`<div class="quote-meta">${esc(x.date)}</div>`:'')}
      ${customBlock?`<div style="margin-top:8px">${customBlock}</div>`:''}</div></div>`;
  }

  // default layout (原有逻辑)
  if(m.type==="todo"){
    const p=(m.priorities||[]).find(p=>p.key===x.priority);
    return `<div class="rec ${layoutCls}">${acts}<div class="top">
      <div class="chk js-chk ${x.done?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><div class="rname ${x.done?'done':''}">${esc(x.title)}</div>
      <div class="rmeta">${p?`<span class="badge" style="background:${p.color};color:${p.text}"><span class="dot"></span>${p.label}</span>`:''}</div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  if(m.type==="checkin"){
    const on=!!(x.log&&x.log[today()]); const st=streak(x.log);
    return `<div class="rec ${layoutCls}">${acts}<div class="top">
      <div class="chk js-chk ${on?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span class="streak">${icon("flame",13)} 连续 ${st} 天</span>${on?'<span class="badge" style="background:var(--accent-muted);color:var(--accent)">今日已打卡</span>':''}</div>${customBlock}</div></div></div>`;
  }
  if(m.type==="progress"){
    const pct=Math.min(100,Math.round((x.current/x.target)*100||0));
    return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
      <div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span style="color:var(--text-secondary);font-size:13px">${x.current}/${x.target} ${x.unit||m.unit||''} · ${pct}%</span></div>
      <div class="pbar"><i style="width:${pct}%;background:${m.color}"></i></div>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`;
  }
  if(m.type==="finance"){
    const inc=x.type==="income";
    return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
      <div class="rname">${esc(x.title)}</div>
      <div class="rmeta"><span class="badge" style="background:var(--surface-nested);color:var(--text-secondary)">${esc(x.category||'其他')}</span><span style="color:var(--text-secondary);font-size:12px">${x.date||''}</span></div>${customBlock}</div>
      <div class="amt ${inc?'inc':'exp'}" style="margin-left:auto">${inc?'+':'-'}¥${x.amount}</div></div></div>`;
  }
  // note
  return `<div class="rec ${layoutCls}">${acts}<div class="top">${thumb}<div class="body" data-edit="${x.id}">
    <div class="rname">${esc(x.title||'无标题')}</div>
    <div class="rmeta">${x.mood?`<span class="badge" style="background:var(--accent-muted);color:var(--accent)">${esc(x.mood)}</span>`:''}<span style="color:var(--text-secondary);font-size:12px">${x.date||''}</span></div>
    ${x.content?`<div class="rnote">${esc(x.content)}</div>`:''}${customBlock}</div></div></div>`;
}

function streak(log){
  if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const key=d.toISOString().slice(0,10); if(log[key]){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}

function wireModule(key){
  const m=modOf(key);
  $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id);
    if(m.type==="todo"){ x.done=!x.done; }
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true; }
    persist();
  });
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });
  const add=$("#btn-add"); if(add) add.onclick=()=>openEditor(key,null);
  if(m.type==="checkin") wireCalendar(key, data[key]||[]);
}

  } else if(m.type==="checkin"){
    fields=`<div class="field"><label>打卡项</label><input id="f-title" value="${attr(d.title)}" placeholder="例如：喝够 8 杯水"/></div>
      <p class="sub" style="margin:0">保存后可在列表点击左侧方块打卡；连续天数自动统计，每天从零开始。</p>`;
  } else if(m.type==="progress"){
    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}" placeholder="书名 / 目标"/></div>
      <div class="frow"><div class="field"><label>当前</label><input id="f-cur" type="number" value="${d.current??0}"/></div>
      <div class="field"><label>目标</label><input id="f-tgt" type="number" value="${d.target??1}"/></div>
      <div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||m.unit||'')}"/></div></div>
      <div class="field"><label>摘录 / 想法</label><textarea id="f-note" placeholder="随手记">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="finance"){
    fields=`<div class="field"><label>类型</label><div class="seg" id="f-ftype">
        <div class="opt ${d.type!=='income'?'on':''}" data-v="expense">支出</div>
        <div class="opt ${d.type==='income'?'on':''}" data-v="income">收入</div></div></div>
      <div class="frow"><div class="field"><label>项目</label><input id="f-title" value="${attr(d.title)}" placeholder="午餐 / 稿费"/></div>
      <div class="field"><label>金额 ¥</label><input id="f-amt" type="number" value="${d.amount??''}" placeholder="0"/></div></div>
      <div class="field"><label>分类</label><div class="seg" style="flex-wrap:wrap" id="f-cat">${(m.categories||[]).map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  } else { // note
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" style="flex-wrap:wrap" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto">${md}</div>`).join("")}</div></div>`:''}
      <div class="field"><label>内容</label><textarea id="f-content" placeholder="写点什么…">${esc(d.content||'')}</textarea></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  }

  // layout variant selector
  const layoutOpts=[{v:'default',l:'标准'},{v:'feature',l:'大图'},{v:'quote',l:'引文'}];
  fields=`<div class="field"><label>卡片样式</label><div class="seg" id="f-layout">${layoutOpts.map(o=>`<div class="opt ${o.v===(d.layout||'default')?'on':''}" data-v="${o.v}">${o.l}</div>`).join("")}</div></div>`+fields;

  // custom fields (from m.fields config) — rendered after type-specific fields
  (m.fields||[]).forEach(f=>{
    const v=d[f.key]||"";
    if(f.type==="select") fields+=`<div class="field"><label>${esc(f.label)}</label><div class="seg" style="flex-wrap:wrap" id="f-cf-${f.key}">${(f.options||[]).map(o=>`<div class="opt ${o===v?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto">${esc(o)}</div>`).join("")}</div></div>`;
    else if(f.type==="textarea") fields+=`<div class="field"><label>${esc(f.label)}</label><textarea id="f-cf-${f.key}" placeholder="${attr(f.placeholder||'')}">${esc(v)}</textarea></div>`;
    else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
    else fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
  });
  // shared image URL field (all types)
  fields+=`<div class="field"><label>图片 URL（可选）</label><input id="f-image" value="${attr(d.image||'')}" placeholder="https://..."/></div>`;

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div>
    <h2>${editing?'编辑':'新建'} · ${m.name}</h2><div class="sub">${m.desc}</div>
    ${fields}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  // segmented pickers
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
  }));
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key, d.id); };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    d.layout=seg("#f-layout")||'default';
    if(m.type==="todo"){ d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; d.date=val("#f-date"); }
    else if(m.type==="note"){ d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    // save custom fields
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    // save image
    d.image=(val("#f-image")||"").trim();
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
  };
}

function newItem(m){
  const base={ id: Date.now() };
  let item;
  if(m.type==="todo") item={...base, title:"", priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"), done:false, note:""};
  else if(m.type==="checkin") item={...base, title:"", log:{}};
  else if(m.type==="progress") item={...base, title:"", current:0, target: (m.unit==="页"?100:20), unit:m.unit||"", note:""};
  else if(m.type==="finance") item={...base, title:"", type:"expense", amount:"", category:(m.categories&&m.categories[0])||"其他", date:isoToday()};
  else item={...base, title:"", content:"", mood:(m.moods&&m.moods[0])||"", date:isoToday()};
  // initialize custom fields
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]= f.type==="select"?(f.options&&f.options[0]||""):""; });
  return item;
}

/* ---------- delete confirm ---------- */
function confirmDelete(key,id){
  const item=(data[key]||[]).find(i=>i.id==id); if(!item) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal"><div class="grab"></div><h2>删除记录</h2>
    <div class="sub">确定删除「${esc(item.title||'这条记录')}」？此操作不可撤销。</div>
    <div class="modal-actions"><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(i=>i.id!=id); persist(); close(); };
}

/* ---------- router / nav ---------- */
let botView = 'home';
// 页面级轮询句柄集中管理：离开页面即清，防止后台定时器泄漏
let pollTimer = null;
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
function go(v){
  closeDrawer();
  stopPoll();  // 切页先停轮询，再重渲染
  if(typeof v==='string' && v.indexOf('bot-')===0) botView = v.slice(4);   // 能力卡 → 子页
  else if(v==='bot') botView = 'home';                                     // 底部机器人 → 首页
  render();
  window.scrollTo({top:0});
}
function render(){
  // 工作台整体为微信机器人服务：子页标题随能力卡切换，首页显示模块标题
  const subTitles = {
    usage:['Token 用量','用量 · 趋势 · 排行'],
    ai:['AI 智能回复','连续上下文 · 私聊'],
    group:['群聊 @ 应答','进群才会响应'],
    msg:['多类型消息','文本 · 图片 · 语音 …'],
    mem:['记忆学习','长期记忆库'],
    recall:['向量召回','相关记忆 · 注入上下文'],
    config:['在线配置','提示词 · 模型 · 开关'],
    sys:['系统监控','CPU · 内存 · 网络 · 负载'],
    logs:['运行日志','实时拦截 console 输出'],
    contacts:['好友管理','联系人 · 备注 · 私聊'],
    rooms:['群聊管理','群列表 · 成员 · 群发'],
    send:['主动发消息','私聊 / 群发 一键触达'],
  };
  const [t,s] = subTitles[botView] || ['微信机器人', CONFIG.slogan];
  $("#topTitle").firstChild.textContent = t;
  $("#topSub").textContent = s;
  $("#nav").querySelector('[data-nav="bot"]').classList.add("active");
  renderBot(botView);
}

/* ---------- drawer ---------- */
function buildDrawer(){
  $("#drawerName").textContent=CONFIG.owner;
  $("#drawerSlogan").textContent=CONFIG.slogan;
  const items=[
    `<div class="ditem" data-go="bot">${icon("bolt",20)}微信机器人</div>`,
    `<div class="ditem" data-go="bot-usage">${icon("chart",20)}Token 用量</div>`,
    `<div class="ditem" data-go="bot-ai">${icon("user",20)}AI 智能回复</div>`,
    `<div class="ditem" data-go="bot-group">${icon("user",20)}群聊 @ 应答</div>`,
    `<div class="ditem" data-go="bot-mem">${icon("leaf",20)}记忆学习</div>`,
    `<div class="ditem" data-go="bot-recall">${icon("target",20)}向量召回</div>`,
    `<div class="ditem" data-go="bot-msg">${icon("camera",20)}多类型消息</div>`,
    `<div class="ditem" data-go="bot-config">${icon("gear",20)}在线配置</div>`,
    `<div class="ditem" data-go="bot-sys">${icon("activity",20)}系统监控</div>`,
    `<div class="ditem" data-go="bot-logs">${icon("list",20)}运行日志</div>`,
    `<div class="ditem" data-go="bot-contacts">${icon("user",20)}好友管理</div>`,
    `<div class="ditem" data-go="bot-rooms">${icon("msg",20)}群聊管理</div>`,
    `<div class="ditem" data-go="bot-send">${icon("bolt",20)}主动发消息</div>`,
  ];
  $("#drawerList").innerHTML=items.join("");
  $("#drawerList").querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>go(el.dataset.go));
}
function openDrawer(){
  $("#drawerList").querySelectorAll(".ditem").forEach(el=>el.classList.toggle("active", el.dataset.go===('bot-'+botView)));
  $("#drawer").classList.add("show"); $("#scrim").classList.add("show");
}
function closeDrawer(){ $("#drawer").classList.remove("show"); $("#scrim").classList.remove("show"); }

/* ---------- wire chrome ---------- */
$("#btn-menu").onclick=openDrawer;
$("#drawerClose").onclick=closeDrawer;
$("#scrim").onclick=closeDrawer;
$("#nav").querySelectorAll(".n").forEach(n=>n.onclick=()=>{
  const t=n.dataset.nav;
  if(t==="drawer") openDrawer();
  else go();   // bot / refresh 均重载机器人仪表盘
});

/* ---------- avatar upload ---------- */
$("#brandCam").innerHTML = icon("camera",18);
if(data.__avatar) $("#brandImg").src = data.__avatar;
$("#drawerBrand").onclick = () => $("#avatarInput").click();
$("#avatarInput").onchange = e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => { data.__avatar = reader.result; $("#brandImg").src = reader.result; store.save(); };
  reader.readAsDataURL(f);
  e.target.value = "";
};

/* ---------- utils ---------- */
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }

/* ---------- keyboard shortcut hint ---------- */
const KBD_SHORTCUTS = [
  { keys: ['Ctrl','S'], desc: '保存记忆' },
  { keys: ['Ctrl','R'], desc: '刷新当前页' },
  { keys: ['Ctrl','D'], desc: '打开/收起抽屉' },
  { keys: ['?'], desc: '显示/隐藏本提示' },
  { keys: ['Esc'], desc: '关闭浮层' },
];
function toggleKbdPanel(){
  const hint = $("#kbdHint");
  let panel = document.getElementById("kbdPanel");
  if(panel){ panel.remove(); hint.classList.remove("active"); return; }
  panel = document.createElement("div");
  panel.className = "kbd-panel";
  panel.id = "kbdPanel";
  panel.innerHTML = `<div class="kbd-t">快捷键</div>` +
    KBD_SHORTCUTS.map(s=>`<div class="kbd-row"><span>${esc(s.desc)}</span><span>${s.keys.map(k=>`<kbd>${esc(k)}</kbd>`).join("")}</span></div>`).join("");
  document.body.appendChild(panel);
  const closePanel = (e)=>{
    if(!panel.contains(e.target) && e.target!==hint) panel.remove();
  };
  document.addEventListener("click", closePanel, { once:true });
  hint.classList.add("active");
}
$("#kbdHint").onclick = (e)=>{ e.stopPropagation(); toggleKbdPanel(); };
document.addEventListener("keydown", (e)=>{
  if(e.key==="?" && !e.ctrlKey && !e.metaKey){ e.preventDefault(); toggleKbdPanel(); }
});
document.addEventListener("keydown", (e)=>{
  if(e.key==="Escape"){ const p=document.getElementById("kbdPanel"); if(p) p.remove(); }
});

buildDrawer();
render();
initNetworkMonitor();
</script>
</body>
